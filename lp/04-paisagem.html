<script>
(function(){
  var sec = document.getElementById('cx-pais');
  if(!sec) return;
  var reduz = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if('IntersectionObserver' in window && !reduz){
    sec.classList.add('cx-js');
    var io = new IntersectionObserver(function(en){ if(en[0].isIntersecting){ sec.classList.add('is-visivel'); io.disconnect(); } }, {threshold:.2});

  var cena = sec.querySelector('.cx-pais__cena'), pend = false;
  function atualiza(){
    pend = false;
    var r = sec.getBoundingClientRect(), vh = window.innerHeight;

    cena.style.setProperty('--cx-ps', (1 + p * .06).toFixed(3));
  }
  window.addEventListener('scroll', function(){ if(!pend){ pend = true; requestAnimationFrame(atualiza); } }, {passive:true});
  atualiza();
})();
